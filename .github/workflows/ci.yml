name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # Run on each real OS rather than cross-compiling: the install path is
    # platform-specific (directory layout on Linux and macOS, the registry on
    # Windows) and only executes on the platform it targets.
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # -v so the log names the tests that ran on each OS: the Windows-only
      # registry coverage is selected by build tag and otherwise invisible.
      - name: test
        run: go test -v ./...

  js:
    name: js syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: check
        # node --check only looks at its first argument, so loop.
        run: |
          for f in background.js popup.js firefox/background.js firefox/popup.js; do
            echo "checking $f"
            node --check "$f"
          done
